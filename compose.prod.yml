name: infobus-prod

# ---------------------------------------------------------------------------
# Required environment variables (set in .env):
#
#   Domain routing (Traefik):
#     ORCHESTRATOR_DOMAIN    – Django API / admin
#     UI_DOMAIN              – Nuxt frontend
#     LAKE_DOMAIN            – MinIO S3-compatible API
#     CERT_RESOLVER          – Traefik cert resolver name (default: letsencrypt)
#
#   Credentials:
#     SECRET_KEY             – Django secret key
#     DB_PASSWORD            – PostgreSQL password
#     REDIS_PASSWORD         – Redis password
#     RABBITMQ_USER / RABBITMQ_PASS – RabbitMQ credentials
#     MINIO_ROOT_USER / MINIO_ROOT_PASSWORD – MinIO credentials
#     minio.license          – MinIO license file in the repository root
# ---------------------------------------------------------------------------

services:

  # ── Django (Daphne ASGI) ──────────────────────────────────────────────────
  orchestrator:
    build:
      context: ./backend
      target: prod
    environment:
      - DJANGO_SETUP=True
      - UV_PROJECT_ENVIRONMENT=/home/app/.venv
    env_file:
      - .env
      - .env.prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - backend_venv:/home/app/.venv
      - lake_data:/app/data
      - static_files:/app/staticfiles
    depends_on:
      database:
        condition: service_healthy
      state:
        condition: service_healthy
    networks:
      - internal
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.orchestrator.rule=Host(`${ORCHESTRATOR_DOMAIN}`)"
      - "traefik.http.routers.orchestrator.entrypoints=websecure"
      - "traefik.http.routers.orchestrator.tls=true"
      - "traefik.http.routers.orchestrator.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.orchestrator.middlewares=security-headers@file,rate-limit@file,compression@file"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik_proxy"

  # ── Celery worker ─────────────────────────────────────────────────────────
  engine:
    build:
      context: ./backend
      target: engine
    environment:
      - DJANGO_SETUP=False
      - UV_PROJECT_ENVIRONMENT=/home/app/.venv
    env_file:
      - .env
      - .env.prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - backend_venv:/home/app/.venv
      - lake_data:/app/data
    depends_on:
      database:
        condition: service_healthy
      state:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks:
      - internal

  # ── Celery Beat ───────────────────────────────────────────────────────────
  scheduler:
    build:
      context: ./backend
      target: scheduler
    environment:
      - DJANGO_SETUP=False
      - UV_PROJECT_ENVIRONMENT=/home/app/.venv
    env_file:
      - .env
      - .env.prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - backend_venv:/home/app/.venv
      - lake_data:/app/data
    depends_on:
      database:
        condition: service_healthy
      state:
        condition: service_healthy
      broker:
        condition: service_healthy
    networks:
      - internal

  # ── Redis Streams consumer ────────────────────────────────────────────────
  streams:
    build:
      context: ./backend
      target: streams
    environment:
      - DJANGO_SETUP=False
      - UV_PROJECT_ENVIRONMENT=/home/app/.venv
    env_file:
      - .env
      - .env.prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - backend_venv:/home/app/.venv
    depends_on:
      database:
        condition: service_healthy
      state:
        condition: service_healthy
    networks:
      - internal
      
  # ── RabbitMQ (AMQP message broker) ────────────────────────────────────────
  broker:
    image: rabbitmq:4.3.5-management
    volumes:
      - broker_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - internal

  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  database:
    build:
      context: ./database
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME:-infobus}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}", "-d", "${DB_NAME:-infobus}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - internal

  # ── Redis ─────────────────────────────────────────────────────────────────
  state:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - memory_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      internal:
        aliases:
          - memory

  # ── MinIO object storage ──────────────────────────────────────────────────
  lake:
    image: ${MINIO_IMAGE:-quay.io/minio/aistor/minio:latest}
    command: server /mnt/data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/mnt/data
      - ./minio.license:/minio.license:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - traefik_proxy
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lake.rule=Host(`${LAKE_DOMAIN:?set LAKE_DOMAIN in .env}`)"
      - "traefik.http.routers.lake.entrypoints=websecure"
      - "traefik.http.routers.lake.tls=true"
      - "traefik.http.routers.lake.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.lake.middlewares=security-headers@file"
      - "traefik.http.services.lake.loadbalancer.server.port=9000"
      - "traefik.docker.network=traefik_proxy"

  # ── Nuxt frontend ────────────────────────────────────────────────────────
  user-interface:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    environment:
      - NUXT_PUBLIC_API_BASE=https://${ORCHESTRATOR_DOMAIN}
      - NUXT_PORT=3000
    env_file:
      - .env
      - .env.prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      orchestrator:
        condition: service_started
    networks:
      - internal
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ui.rule=Host(`${UI_DOMAIN}`)"
      - "traefik.http.routers.ui.entrypoints=websecure"
      - "traefik.http.routers.ui.tls=true"
      - "traefik.http.routers.ui.tls.certresolver=${CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.ui.middlewares=security-headers@file,compression@file"
      - "traefik.http.services.ui.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik_proxy"

volumes:
  database_data:
  memory_data:
  lake_data:
  broker_data:
  backend_venv:
  static_files:
  minio_data:

networks:
  internal:
    name: infobus_internal
  traefik_proxy:
    external: true
