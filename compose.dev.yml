name: infobus-dev
services:

  # ── Django orchestrator ───────────────────────────────────────────────────
  orchestrator:
    build:
      context: ./backend
      target: dev
    environment:
      - DJANGO_SETUP=True
      - UV_PROJECT_ENVIRONMENT=/home/app/.venv
    env_file:
      - .env
      - .env.dev
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/home/app/.venv
      - backend_data:/app/data
    depends_on:
      database:
        condition: service_healthy
      state:
        condition: service_healthy

  # ── Celery worker ─────────────────────────────────────────────────────────
  engine:
    build:
      context: ./backend
      target: engine
    environment:
      - DJANGO_SETUP=False
      - UV_PROJECT_ENVIRONMENT=/home/app/.venv
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./backend:/app
      - backend_venv:/home/app/.venv
      - backend_data:/app/data
    depends_on:
      database:
        condition: service_healthy
      state:
        condition: service_healthy
      broker:
        condition: service_healthy

  # ── Celery Beat ───────────────────────────────────────────────────────────
  scheduler:
    build:
      context: ./backend
      target: scheduler
    environment:
      - DJANGO_SETUP=False
      - UV_PROJECT_ENVIRONMENT=/home/app/.venv
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./backend:/app
      - backend_venv:/home/app/.venv
      - backend_data:/app/data
    depends_on:
      database:
        condition: service_healthy
      state:
        condition: service_healthy
      broker:
        condition: service_healthy

  # ── Redis Streams consumer ────────────────────────────────────────────────
  streams:
    build:
      context: ./backend
      target: streams
    environment:
      - DJANGO_SETUP=False
      - UV_PROJECT_ENVIRONMENT=/home/app/.venv
    env_file:
      - .env
      - .env.dev
    volumes:
      - ./backend:/app
      - backend_venv:/home/app/.venv
    depends_on:
      database:
        condition: service_healthy
      state:
        condition: service_healthy

  # ── RabbitMQ (AMQP message broker) ────────────────────────────────────────
  broker:
    image: rabbitmq:4-management
    ports:
      - "${BROKER_AMQP_PORT:-5672}:5672"          # AMQP
      - "${BROKER_MANAGEMENT_PORT:-15672}:15672"  # Management UI
      - "${BROKER_PROMETHEUS_PORT:-15692}:15692"  # Prometheus
    volumes:
      - broker_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────────
  database:
    build:
      context: ./database
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_NAME:-infobus}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USER:-postgres}", "-d", "${DB_NAME:-infobus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  state:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    ports:
      - "${MEMORY_PORT:-6379}:6379"
    volumes:
      - memory_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - memory

  # ── MinIO object storage ──────────────────────────────────────────────────
  lake:
    image: ${MINIO_IMAGE:-quay.io/minio/aistor/minio:latest}
    restart: unless-stopped
    command: server /mnt/data --console-address ":9001" --license /minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${LAKE_PORT:-9000}:9000"
      - "${LAKE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - lake_data:/mnt/data
      - ./minio.license:/minio.license:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Nuxt frontend ────────────────────────────────────────────────────────
  user-interface:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      - NUXT_PUBLIC_API_BASE=http://orchestrator:8000
      - NUXT_PORT=3000
    env_file:
      - .env
      - .env.dev
    ports:
      - "${USER_INTERFACE_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - ui_node_modules:/app/node_modules
    depends_on:
      orchestrator:
        condition: service_started

volumes:
  database_data:
  memory_data:
  backend_data:
  lake_data:
  broker_data:
  ui_node_modules:
  backend_venv:

networks:
  default:
    name: infobus_network
