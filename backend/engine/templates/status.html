{% load static %}

<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>bUCR | Servidor en tiempo real</title>
    <link rel="icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
    <link href="{% static 'vendor/bootstrap/5.3.3/css/bootstrap.min.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'vendor/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css' %}">
</head>

<body class="d-flex align-items-center justify-content-center text-center" style="height: 100vh;">

    <main class="w-100 m-auto">
        <div class="container">
            <img src="{% static 'img/b.png' %}" width="150px" alt="Símbolo servidor en tiempo real">
            <h1 class="display-1 fw-bold">infobús</h1>
            <h1 class="display-4">Monitor del sistema</h1>
            <div class="col-md-4 mx-auto">
                <p class="lead">Ejecución de tareas de recolección de entidades <em>FeedMessage</em> de GTFS&nbsp;<em>Realtime</em> y almacenamiento en la base de datos.</p>
                <p class="lead"><span class="spinner-grow spinner-grow-sm" role="status" aria-label="Actualizando"></span></p>
                <table class="table">
                    <tr>
                        <td class="text-end">Última actualización:</td>
                        <td class="text-start"><span id="last_update" class="fw-bold"></span></td>
                    </tr>
                    <tr>
                        <td class="text-end">Proveedores de datos:</td>
                        <td class="text-start"><span id="number_providers" class="fw-bold"></span></td>
                    </tr>
                </table>
            </div>
            <span class="badge rounded-pill text-bg-warning">En desarrollo</span>
        </div>
    </main>

    <script src="{% static 'vendor/bootstrap/5.3.3/js/bootstrap.bundle.min.js' %}"></script>

    <script>
        // Crear un WebSocket según el protocolo de la página (producción o desarrollo)
        const wsProtocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        const wsUrl = wsProtocol + window.location.host + '/ws/status/';
        const statusSocket = new WebSocket(wsUrl);

        // Registrar la conexión abierta
        statusSocket.onopen = function (event) {
            console.log('status: Conexión abierta exitosamente en ' + wsUrl, event);
        };
        // Event handler for when the connection is closed
        statusSocket.onclose = function(event) {
            console.log('status: conexión cerrada del WebSocket:', event);
            // You can add custom logic here, such as attempting to reconnect
        };
        // Event handler for when an error occurs
        statusSocket.onerror = function(event) {
            console.log('status: error del WebSocket:', event);
            // You can add custom logic here, such as attempting to reconnect
        };

        // Manejo de eventos de mensajes
        statusSocket.onmessage = function (event) {
            console.log('Mensaje recibido:', event.data);
            const json = JSON.parse(event.data);
            const data = json['message'];
            document.getElementById('last_update').textContent = data['last_update'];
            document.getElementById('number_providers').textContent = data['number_providers'];
        };
    </script>

</body>

</html>
